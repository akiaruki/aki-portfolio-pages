name: Verify legacy redirects

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  redirects:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redirect source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify old pages point to maintained addresses
        run: node .github/scripts/verify-redirects.cjs
