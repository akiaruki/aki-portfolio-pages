name: Mirror public short links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aki-root-pages-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'akiaruki/aki-portfolio-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          persist-credentials: false
      - name: Check out root Pages with its repository-scoped deploy key
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: akiaruki/akiaruki.github.io
          ref: main
          path: root-pages
          ssh-key: ${{ secrets.AKI_ROOT_PAGES_DEPLOY_KEY }}
      - name: Prepare and check the managed mirror
        run: node source/.github/scripts/mirror-short-links.cjs source root-pages
      - name: Publish only the managed paths
        working-directory: root-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .nojekyll portfolio aki-studio aki-camera aki-gazette aki-moments
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update public Aki short links"
          git push origin HEAD:main
